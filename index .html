<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Chat</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#172033;--muted:#718096;--brand:#176b58;--brand2:#218b70;--line:#e6ebf0;--mine:#d9f8e8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);height:100vh}
.app{height:100vh;max-width:1200px;margin:auto;background:var(--panel);display:grid;grid-template-columns:330px 1fr;box-shadow:0 8px 35px #1d355722}
.sidebar{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px;background:var(--brand);color:white;display:flex;align-items:center;justify-content:space-between}
.brand h1{font-size:21px;margin:0}.brand small{opacity:.8}
.search{padding:13px;border-bottom:1px solid var(--line)}input,button{font:inherit}
.search input{width:100%;border:0;background:#f1f4f7;padding:12px 14px;border-radius:22px;outline:none}
.contacts{overflow:auto}.contact{width:100%;border:0;background:white;padding:14px;display:flex;gap:12px;text-align:left;align-items:center;border-bottom:1px solid #f0f2f5;cursor:pointer}
.contact.active,.contact:hover{background:#f0f8f5}.avatar{width:45px;height:45px;border-radius:50%;background:#d7eee5;color:var(--brand);display:grid;place-items:center;font-weight:bold;flex:none}
.info{min-width:0;flex:1}.info strong{display:block}.info small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}
.chathead{height:74px;padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.chathead .avatar{width:43px;height:43px}.chathead strong{display:block}.chathead small{color:var(--muted)}
.messages{flex:1;overflow:auto;padding:24px;background-color:#f6f8f9;background-image:radial-gradient(#dfe8e4 0.7px,transparent .7px);background-size:18px 18px}
.day{text-align:center;color:var(--muted);font-size:12px;margin:0 auto 20px;background:#fff;padding:7px 13px;border-radius:14px;width:max-content}
.bubble{max-width:min(72%,520px);padding:11px 14px;margin:9px 0;border-radius:15px;line-height:1.4;overflow-wrap:anywhere;box-shadow:0 1px 2px #0000000c}
.bubble p{margin:0}.bubble time{display:block;text-align:right;font-size:10px;color:#728079;margin-top:5px}
.bubble.mine{background:var(--mine);margin-left:auto;border-bottom-right-radius:4px}.bubble.theirs{background:white;margin-right:auto;border-bottom-left-radius:4px}
.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:white}
.composer input{flex:1;min-width:0;border:0;background:#f1f4f7;border-radius:25px;padding:13px 17px;outline:none}
.send{border:0;background:var(--brand);color:white;padding:0 22px;border-radius:25px;font-weight:bold;cursor:pointer}.send:hover{background:var(--brand2)}
.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.mobile-back{display:none;border:0;background:none;font-size:22px}
@media(max-width:650px){.app{display:block}.sidebar{height:100vh}.chat{display:none;height:100vh}.app.chat-open .sidebar{display:none}.app.chat-open .chat{display:flex}.mobile-back{display:block}.bubble{max-width:86%}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside class="sidebar">
  <header class="brand"><div><h1>Meu Chat</h1><small>Mensagens simples e rápidas</small></div><span>●</span></header>
  <div class="search"><input id="search" placeholder="Pesquisar conversa..." aria-label="Pesquisar conversa"></div>
  <div class="contacts" id="contacts"></div>
 </aside>
 <main class="chat">
  <header class="chathead">
   <button class="mobile-back" id="back" aria-label="Voltar">‹</button>
   <div class="avatar" id="headAvatar">A</div>
   <div><strong id="headName">Amigo</strong><small>Conversa neste dispositivo</small></div>
  </header>
  <section class="messages" id="messages" aria-live="polite"></section>
  <form class="composer" id="form">
   <input id="messageInput" autocomplete="off" placeholder="Escreve uma mensagem..." aria-label="Escreve uma mensagem">
   <button class="send" type="submit">Enviar</button>
  </form>
 </main>
</div>
<script>
const people=[
 {id:1,name:"Ana",preview:"Olá! Tudo bem?",color:"#dcecff"},
 {id:2,name:"Carlos",preview:"Até mais tarde.",color:"#fce8d9"},
 {id:3,name:"Maria",preview:"Obrigado pela mensagem.",color:"#f4e3fb"},
 {id:4,name:"Grupo dos Amigos",preview:"Bem-vindos ao grupo!",color:"#e0f1df"}
];
const initial={
 1:[{text:"Olá! Tudo bem?",mine:false,time:"09:10"},{text:"Estou bem, e tu?",mine:true,time:"09:12"}],
 2:[{text:"Até mais tarde.",mine:false,time:"Ontem"}],
 3:[{text:"Obrigado pela mensagem.",mine:false,time:"Ontem"}],
 4:[{text:"Bem-vindos ao grupo!",mine:false,time:"Segunda"}]
};
let chats=JSON.parse(localStorage.getItem("meuChatMessages")||"null")||initial;
let selected=1;
const $=id=>document.getElementById(id);
function initials(name){return name.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase()}
function save(){localStorage.setItem("meuChatMessages",JSON.stringify(chats))}
function renderContacts(){
 const q=$("search").value.toLowerCase();
 $("contacts").innerHTML="";
 people.filter(p=>p.name.toLowerCase().includes(q)).forEach(p=>{
  const last=chats[p.id]?.at(-1);
  const b=document.createElement("button");b.className="contact"+(p.id===selected?" active":"");
  b.innerHTML=`<span class="avatar">${initials(p.name)}</span><span class="info"><strong></strong><small></small></span>`;
  b.querySelector("strong").textContent=p.name;
  b.querySelector("small").textContent=last?last.text:p.preview;
  b.onclick=()=>selectChat(p.id);$("contacts").appendChild(b);
 });
}
function renderMessages(){
 const p=people.find(x=>x.id===selected);$("headName").textContent=p.name;$("headAvatar").textContent=initials(p.name);
 const box=$("messages");box.innerHTML='<div class="day">Hoje</div>';
 (chats[selected]||[]).forEach(m=>{
  const bubble=document.createElement("div");bubble.className="bubble "+(m.mine?"mine":"theirs");
  const text=document.createElement("p");text.textContent=m.text;
  const time=document.createElement("time");time.textContent=m.time;
  bubble.append(text,time);box.appendChild(bubble);
 });
 box.scrollTop=box.scrollHeight;
}
function selectChat(id){selected=id;renderContacts();renderMessages();$("app").classList.add("chat-open");}
$("form").addEventListener("submit",e=>{
 e.preventDefault();const input=$("messageInput"),text=input.value.trim();if(!text)return;
 const now=new Date(),time=now.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
 chats[selected]=chats[selected]||[];chats[selected].push({text,mine:true,time});save();input.value="";renderMessages();renderContacts();
});
$("search").addEventListener("input",renderContacts);
$("back").onclick=()=>$("app").classList.remove("chat-open");
renderContacts();selectChat(1);
</script>
</body>
</html>
